name: release

on:
    release:
        types: [published]

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: step one
              uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
              with:
                  ssh-private-key: ${{ secrets.PRIVATE_KEY }}

            - name: step two
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ssh-key: ${{ secrets.PRIVATE_KEY }}

            - name: step three
              run: composer install --no-dev

            - name: step four
              run: npm install

            - name: step five
              run: npm run build

            - name: step six
              run: zip -r ${{ github.event.repository.name }}.${{ github.ref_name }}.zip ${{ github.event.repository.name }}

            - name: step seven
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ github.event.repository.name }}.${{ github.ref_name }}
                  path: ${{ github.event.repository.name }}.${{ github.ref_name }}.zip

            - name: step eight
              uses: JasonEtco/upload-to-release@d648f1babf776de9cad881320bd9e9818fc3b262 # master, 2020-01-17
              with:
                  args: ${{ github.event.repository.name }}.${{ github.ref_name }}.zip application/zip
              env:
                  GITHUB_TOKEN: ${{ secrets.TOKEN }}